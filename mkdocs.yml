{
  "site_name": "LandminenTester Docs",
  "site_description": "Documentation for LandminenTester bundles, tools and resources for BlackICE servers.",
  "site_url": "https://blackice.landminentester.de/",
  "repo_url": "https://github.com/LandminenTester/blackice-docs",
  "docs_dir": "content",
  "site_dir": "site",
  "edit_uri": "edit/main/content/",
  "theme": {
    "name": "mkdocs",
    "custom_dir": "theme",
    "highlightjs": false
  },
  "markdown_extensions": [
    "tables",
    "fenced_code",
    "attr_list",
    {
      "toc": {
        "permalink": "#"
      }
    },
    {
      "codehilite": {
        "guess_lang": false
      }
    }
  ],
  "extra": {
    "resources": [
      {
        "name": "BlackICE Server Panel",
        "kind": "Server management",
        "description": "Manage your server, console, users and bundles from one web interface.",
        "icon": "panel",
        "path": "webpanel/README.md",
        "guide": "webpanel/docs/operations.md",
        "reference": "webpanel/API.md",
        "repository": "https://github.com/LandminenTester/blackice-server-panel",
        "relation": "Independent resource"
      },
      {
        "name": "lt_database",
        "kind": "Server bundle",
        "description": "Declare schemas and read or write database records directly from your server bundles.",
        "icon": "database",
        "path": "lt-database/README.md",
        "guide": "lt-database/docs/INSTALL.md",
        "reference": "lt-database/docs/REFERENCE.md",
        "repository": "https://github.com/LandminenTester/lt-database",
        "relation": "Requires lt-database-api"
      },
      {
        "name": "lt-database-api",
        "kind": "Database service",
        "description": "A signed HTTP API for PostgreSQL, MySQL and MongoDB. The backend for lt_database.",
        "icon": "api",
        "path": "lt-database-api/README.md",
        "guide": "lt-database-api/docs/DEPLOYMENT.md",
        "reference": "lt-database-api/docs/API.md",
        "repository": "https://github.com/LandminenTester/lt-database-api",
        "relation": "Used by lt_database"
      }
    ]
  },
  "hooks": [
    "hooks/localization.py"
  ],
  "plugins": [
    "search",
    {
      "i18n": {
        "docs_structure": "suffix",
        "reconfigure_material": false,
        "languages": [
          {
            "locale": "en",
            "default": true,
            "name": "English",
            "build": true
          },
          {
            "locale": "de",
            "name": "Deutsch",
            "build": true,
            "nav_translations": {
              "Start": "Start",
              "Resource library": "Ressourcenbibliothek",
              "Getting started": "Erste Schritte",
              "Sources and maintenance": "Quellen und Pflege",
              "Overview and install": "\u00dcbersicht und Installation",
              "Windows": "Windows",
              "Linux": "Linux",
              "Docker": "Docker",
              "Configuration and operations": "Konfiguration und Betrieb",
              "Users and permissions": "Benutzer und Berechtigungen",
              "Server configuration": "Serverkonfiguration",
              "Updates and rollback": "Updates und Wiederherstellung",
              "Game server updates": "Spielserver-Updates",
              "Bridge and diagnostics": "Bridge und Diagnose",
              "Experimental bundle tools": "Experimentelle Bundle-Tools",
              "HTTP API": "HTTP-API",
              "Build from source": "Aus dem Quellcode bauen",
              "Development and architecture": "Entwicklung und Architektur",
              "Security": "Sicherheit",
              "Overview": "\u00dcbersicht",
              "Database pair quickstart": "Schnellstart: Datenbank und Connector",
              "Install": "Installation",
              "Configuration": "Konfiguration",
              "Usage and examples": "Nutzung und Beispiele",
              "C# exports and builders": "C#-Exporte und Builder",
              "Player preferences walkthrough": "Spielereinstellungen: Praxisbeispiel",
              "Runtime smoke test": "Laufzeit-Funktionstest",
              "Operations and troubleshooting": "Betrieb und Fehlerbehebung",
              "Build and release": "Build und Release",
              "Overview and quickstart": "\u00dcbersicht und Schnellstart",
              "Deployment and configuration": "Bereitstellung und Konfiguration",
              "HTTP API reference": "HTTP-API-Referenz",
              "Optional write-behind": "Optionale Schreibpufferung",
              "Portable schema": "Portables Schema",
              "Security and signing": "Sicherheit und Signaturen",
              "Client and bundle integration": "Client- und Bundle-Anbindung",
              "Architecture and development": "Architektur und Entwicklung",
              "Security reporting": "Sicherheitsprobleme melden",
              "Glossary": "Begriffe und Abk\u00fcrzungen"
            }
          }
        ]
      }
    }
  ],
