        }
      ]
    }
  ],
  "exclude_docs": "SUMMARY.md\nSUMMARY.de.md\n",
  "validation": {
    "links": {
      "not_found": "warn",
      "unrecognized_links": "warn",
      "anchors": "warn"
    }
  }
}
